<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="내 글을 지키는 3단계: 자동 저장, 파일 저장, 전체 백업">
  <g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif">
    <rect width="1200" height="520" rx="24" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="600" y="60" text-anchor="middle" font-size="28" font-weight="800" fill="#1e1b4b">내 글을 지키는 3단계</text>
    <text x="600" y="92" text-anchor="middle" font-size="18" fill="#64748b">단계가 올라갈수록 더 안전합니다</text>

    <!-- 1단계 -->
    <rect x="40" y="124" width="352" height="296" rx="18" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
    <rect x="40" y="124" width="352" height="64" rx="18" fill="#fee2e2"/>
    <rect x="40" y="170" width="352" height="18" fill="#fee2e2"/>
    <text x="64" y="166" font-size="24" font-weight="800" fill="#991b1b">1단계  자동 저장</text>
    <text x="64" y="224" font-size="19" font-weight="700" fill="#1e293b">쓰는 즉시, 알아서</text>
    <text x="64" y="256" font-size="17" fill="#475569">위치: 이 컴퓨터의 이 브라우저 안</text>
    <text x="64" y="284" font-size="17" fill="#475569">하는 일: 없음 (자동)</text>
    <text x="64" y="324" font-size="17" font-weight="700" fill="#b91c1c">⚠️ 이럴 땐 안 보입니다</text>
    <text x="64" y="352" font-size="16" fill="#475569">· 사이트 데이터·기록 삭제</text>
    <text x="64" y="378" font-size="16" fill="#475569">· 다른 컴퓨터·다른 브라우저</text>
    <text x="64" y="404" font-size="16" fill="#475569">· USB를 다른 컴퓨터에 꽂을 때</text>

    <!-- 2단계 -->
    <rect x="424" y="124" width="352" height="296" rx="18" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
    <rect x="424" y="124" width="352" height="64" rx="18" fill="#fef3c7"/>
    <rect x="424" y="170" width="352" height="18" fill="#fef3c7"/>
    <text x="448" y="166" font-size="24" font-weight="800" fill="#92400e">2단계  .md 파일 저장</text>
    <text x="448" y="224" font-size="19" font-weight="700" fill="#1e293b">[저장] 버튼 또는 Ctrl + S</text>
    <text x="448" y="256" font-size="17" fill="#475569">위치: 내가 고른 폴더 · USB</text>
    <text x="448" y="284" font-size="17" fill="#475569">하는 일: 글을 끝낼 때 한 번</text>
    <text x="448" y="324" font-size="17" font-weight="700" fill="#b45309">✔ 좋은 점</text>
    <text x="448" y="352" font-size="16" fill="#475569">· 메모장으로도 열리는 일반 파일</text>
    <text x="448" y="378" font-size="16" fill="#475569">· 어느 컴퓨터로도 옮길 수 있음</text>
    <text x="448" y="404" font-size="16" fill="#475569">· 프로그램이 없어져도 내용이 남음</text>

    <!-- 3단계 -->
    <rect x="808" y="124" width="352" height="296" rx="18" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
    <rect x="808" y="124" width="352" height="64" rx="18" fill="#d1fae5"/>
    <rect x="808" y="170" width="352" height="18" fill="#d1fae5"/>
    <text x="832" y="166" font-size="24" font-weight="800" fill="#065f46">3단계  전체 백업</text>
    <text x="832" y="224" font-size="19" font-weight="700" fill="#1e293b">내보내기 → 전체 백업</text>
    <text x="832" y="256" font-size="17" fill="#475569">위치: .json 파일 1개</text>
    <text x="832" y="284" font-size="17" fill="#475569">하는 일: 일주일에 한 번쯤</text>
    <text x="832" y="324" font-size="17" font-weight="700" fill="#047857">✔ 좋은 점</text>
    <text x="832" y="352" font-size="16" fill="#475569">· 모든 문서 + 붙여넣은 그림</text>
    <text x="832" y="378" font-size="16" fill="#475569">· 새 컴퓨터로 한 번에 복원</text>
    <text x="832" y="404" font-size="16" fill="#475569">· 기존 글을 덮어쓰지 않음</text>

    <!-- 안전도 막대 -->
    <text x="40" y="468" font-size="17" font-weight="700" fill="#64748b">안전도</text>
    <rect x="112" y="452" width="1048" height="22" rx="11" fill="#e2e8f0"/>
    <rect x="112" y="452" width="1048" height="22" rx="11" fill="#e2e8f0"/>
    <rect x="112" y="452" width="349" height="22" rx="11" fill="#f87171"/>
    <rect x="461" y="452" width="350" height="22" fill="#fbbf24"/>
    <rect x="811" y="452" width="349" height="22" rx="11" fill="#34d399"/>
    <rect x="811" y="452" width="20" height="22" fill="#34d399"/>
    <text x="286" y="468" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">기본</text>
    <text x="636" y="468" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">안전</text>
    <text x="985" y="468" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">가장 안전</text>
  </g>
</svg>
